# Render Blueprint: 이 파일이 있는 저장소를 Render 에서 "New > Blueprint" 로 연결하면 설정이 채워진다.
services:
  - type: web
    name: testory-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GPT_API_KEY
        sync: false
      - key: GPT_MODEL
        value: gpt-4o-mini
